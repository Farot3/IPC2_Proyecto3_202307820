<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimo archivo de respuesta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .output {
            margin-top: 20px;
            text-align: left;
        }

        .output textarea {
            width: 800px;
            height: 400px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
        }

        .back-button {
            margin-top: 20px;
        }

        .back-button button {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back-button button:hover {
            background-color: #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Ultimo archivo de respuesta</h1>
        <div class="output">
            <textarea id="output" readonly>{% if datosConsultados %}{{ datosConsultados }}{% endif %}</textarea>
        </div>
        <div class="back-button">
            <button onclick="window.location.href='/'">Regresar al Inicio</button>
        </div>
    </div>
</body>

</html>
