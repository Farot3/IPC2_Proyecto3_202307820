<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peticiones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .options button {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .options button:hover {
            background-color: #555;
        }

        .output {
            margin-top: 20px;
            text-align: left;
        }

        .output textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Peticiones</h1>
        <div class="options">
            <button onclick="window.location.href='{% url 'consultar_datos' %}'">Consultar Datos</button>
            <button onclick="window.location.href='{% url 'resumen_clasificacion_fecha' %}'">Resumen de clasificación
                por fecha</button>
            <button onclick="window.location.href='{% url 'resumen_rango_fechas' %}'">Resumen por rango de
                fechas</button>
            <button onclick="window.location.href='{% url 'reporte_pdf' %}'">Reporte en PDF</button>
            <button onclick="window.location.href='{% url 'prueba_mensaje' %}'">Prueba de mensaje</button>
        </div>
    </div>
</body>

</html>
