<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar Archivo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .upload-form {
            margin-top: 20px;
        }

        .upload-form input[type="file"] {
            margin-bottom: 10px;
        }

        .upload-form button {
            padding: 10px 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .upload-form button:hover {
            background-color: #555;
        }

        .uploaded-file {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Cargar Archivo XML</h1>
        <form class="upload-form" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="archivo" accept=".xml" required>
            <button type="submit">Cargar</button>
        </form>
        {% if uploaded_file_url %}
        <div class="uploaded-file">
            <p>Archivo cargado exitosamente: <a href="{{ uploaded_file_url }}">{{ uploaded_file_url }}</a></p>
        </div>
        {% endif %}
    </div>
</body>

</html>
